
name: Hello Python App to Docker

'on':
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run smoke test
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          import urllib.request

          env = os.environ.copy()
          env['PORT'] = '8001'
          proc = subprocess.Popen(['python', 'app.py'], env=env)
          try:
              time.sleep(2)
              with urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5) as response:
                  body = response.read().decode()
              assert response.status == 200, response.status
              assert 'Hello from Python in Docker!' in body
          finally:
              proc.terminate()
              proc.wait(timeout=10)
          PY

  docker-build-push:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest
